<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kegiatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E3B43; --bg2:#0A2C33; --gold:#F0B429; --paper:#F4F7F6; --muted:#A9C4C6; --line:rgba(244,247,246,.16);
    --display:'Bricolage Grotesque','Trebuchet MS',Arial,sans-serif;
    --body:'Figtree','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:var(--body);color:var(--paper);overflow-x:hidden;
    background:
      linear-gradient(rgba(10,44,51,.72),rgba(10,44,51,.72)),
      url('bg.png') center/cover no-repeat fixed,
      radial-gradient(1200px 700px at 85% 20%,#14525c 0%,var(--bg) 45%,var(--bg2) 100%);
  }
  .logo{position:fixed;top:clamp(14px,2vw,28px);right:clamp(16px,3vw,48px);z-index:5;
    height:clamp(44px,5.5vw,76px);width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
  .slide{min-height:100vh;max-width:1440px;margin:auto;padding:clamp(24px,4vw,64px) clamp(20px,5vw,80px) 170px}
  h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:clamp(30px,4.8vw,66px);line-height:1.05;
    padding-bottom:18px;border-bottom:3px solid var(--gold);width:max-content;max-width:100%}
  .sub{color:var(--muted);margin:14px 0 24px;font-size:clamp(14px,1.2vw,17px)}
  h2{font:800 clamp(22px,2.6vw,36px)/1.15 var(--display);letter-spacing:-.01em}

  .switch{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
  .sw{cursor:pointer;font:700 clamp(14px,1.2vw,17px)/1.2 var(--display);color:var(--paper);background:rgba(10,44,51,.55);
    border:2px solid var(--line);border-radius:999px;padding:11px 22px;transition:background .2s,border-color .2s,color .2s}
  .sw:hover{border-color:var(--gold)}
  .sw[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg2)}
  .sw:focus-visible,.ph:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .view[hidden]{display:none}
  .view.show{animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .lead{color:#D8E6E6;font-size:clamp(14px,1.2vw,17px);line-height:1.55;max-width:820px;margin:10px 0 22px}

  /* galeri foto */
  .gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,26px)}
  .ph{position:relative;display:block;width:100%;aspect-ratio:4/3;padding:0;border:3px solid var(--gold);border-radius:16px;
    overflow:hidden;background:#1b5560;cursor:zoom-in;transition:transform .25s}
  .ph:hover{transform:translateY(-6px)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .item{margin:0}
  .item figcaption{margin-top:8px;color:var(--muted);font-size:14px;text-align:center}
  .ph.empty{cursor:default;border:3px dashed rgba(240,180,41,.5);background:rgba(10,44,51,.45);display:grid;place-items:center;
    color:var(--muted);font-size:14px;text-align:center;padding:16px}
  .ph.empty:hover{transform:none}
  .ph.empty svg{width:40px;height:40px;display:block;margin:0 auto 10px;opacity:.7}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:15;background:rgba(5,20,24,.92);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}

  /* tombol navigasi */
  .nav{position:fixed;bottom:clamp(14px,2.5vw,40px);width:112px;height:112px;border:0;background:none;color:var(--paper);
    text-decoration:none;display:grid;place-items:center;cursor:pointer;z-index:6}
  .nav.back{left:clamp(14px,3vw,48px)} .nav.next{right:clamp(14px,3vw,48px)}
  .nav svg.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite;animation-direction:reverse}
  .nav text{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.16em;fill:var(--paper)}
  .nav .core{width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--bg2);display:grid;place-items:center;transition:width .25s,height .25s}
  .nav .core svg{width:24px;height:24px;transition:transform .3s}
  .nav:hover .core,.nav:focus-visible .core{width:66px;height:66px}
  .nav.next svg.ring{animation-direction:normal}
  .nav.back:hover .core svg{transform:translateX(-5px)} .nav.next:hover .core svg{transform:translateX(5px)}
  .nav:hover svg.ring{animation-duration:4s}
  .nav:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:50%}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* transisi: pita horizontal bergeser berlawanan arah */
  .bands{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;z-index:20}
  .bands i{flex:1;background:var(--gold);transform:translateX(-101%);transition:transform .5s cubic-bezier(.7,0,.3,1);transition-delay:calc(var(--i)*60ms)}
  .bands i:nth-child(even){background:#14525c;transform:translateX(101%)}
  .bands.go i{transform:none}
  .bands.enter i{transform:none;animation:bandR .5s cubic-bezier(.7,0,.3,1) both;animation-delay:calc(var(--i)*60ms)}
  .bands.enter i:nth-child(even){animation-name:bandL}
  @keyframes bandR{to{transform:translateX(101%)}}
  @keyframes bandL{to{transform:translateX(-101%)}}

  @media (max-width:980px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){
    .slide{padding-top:96px}
    h1{width:auto}
    .gal{grid-template-columns:1fr;max-width:460px}
  }
  @media (prefers-reduced-motion:reduce){
    .nav svg.ring{animation:none}.view.show{animation:none}
    .bands i{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<img class="logo" src="logosekolah.png" alt="Logo sekolah" onerror="this.style.display='none'">

<main class="slide">
  <h1>Kegiatan</h1>
  <p class="sub">SMK Negeri 1 Simpang Teritip, dokumentasi kegiatan tindak lanjut</p>

  <div class="switch" role="tablist" aria-label="Pilih kegiatan"></div>
  <div id="views"></div>
</main>

<div class="lb" id="lb" aria-hidden="true"><img id="lbimg" alt="Foto kegiatan diperbesar"></div>

<a class="nav back" id="back" href="rapor.html" aria-label="Kembali ke halaman Rapor Pendidikan">
  <svg class="ring" viewBox="0 0 132 132" aria-hidden="true"><defs><path id="c1" d="M66,66 m-52,0 a52,52 0 1,1 104,0 a52,52 0 1,1 -104,0"/></defs>
    <text><textPath href="#c1">BACK • SEBELUMNYA • BACK • SEBELUMNYA •</textPath></text></svg>
  <span class="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span>
</a>

<a class="nav next" id="next" href="penutup.html" aria-label="Lanjut ke halaman Penutup">
  <svg class="ring" viewBox="0 0 132 132" aria-hidden="true"><defs><path id="c2" d="M66,66 m-52,0 a52,52 0 1,1 104,0 a52,52 0 1,1 -104,0"/></defs>
    <text><textPath href="#c2">NEXT • SELANJUTNYA • NEXT • SELANJUTNYA •</textPath></text></svg>
  <span class="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
</a>

<div class="bands enter" id="bands"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i></div>

<script>
  /* ===== DAFTAR FOTO =====
     Tambahkan foto pada array "foto" tiap kegiatan, contoh:
       {src:'kegiatan/mou-1.jpg', cap:'Penandatanganan MoU dengan mitra industri'}
     Selama array kosong, ditampilkan kotak foto kosong (placeholder). */
  const KEGIATAN = [
    {id:'mou', tab:'MoU Dunia Kerja', judul:'MoU Dunia Kerja',
     ket:'Dokumentasi penandatanganan kerja sama dan kemitraan sekolah dengan dunia usaha dan dunia industri (DUDI).',
     foto:[{src:'mou1.jpg'},{src:'mou2.jpg'},{src:'mou3.jpg'},{src:'mou4.jpg'},{src:'mou5.jpg'}]},
    {id:'guru', tab:'Peningkatan Kompetensi Guru', judul:'Peningkatan Kompetensi Guru',
     ket:'Dokumentasi pelatihan, workshop, dan pengembangan profesi guru untuk meningkatkan kualitas pembelajaran.',
     foto:[1,2,3,4,5,6].map(n=>({src:'peningkatan'+n+'.jpg'}))},
    {id:'magang', tab:'Magang Siswa', judul:'Magang Siswa',
     ket:'Dokumentasi kegiatan praktik kerja siswa di dunia usaha dan dunia industri.',
     foto:[1,2,3,4,5,6].map(n=>({src:'pkl'+n+'.jfif', alts:['pkl'+n+'.jpg','pkl'+n+'.jpeg']}))},
    {id:'siswa', tab:'Kegiatan Siswa', judul:'Kegiatan Siswa',
     ket:'Dokumentasi berbagai kegiatan siswa di sekolah, mulai dari pembiasaan karakter hingga kegiatan pembinaan siswa.',
     foto:Array.from({length:14},(_,i)=>{const n='kegiatan'+(i+1);return {src:n+'.png', alts:[n+'.jfif',n+'.jpg',n+'.jpeg']}})}
  ];
  const SLOT = 6, ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 16-5-5-8 8"/></svg>';
  function imgFail(img){ const alts = (img.dataset.alts||'').split('|').filter(Boolean); if(alts.length){ img.dataset.alts = alts.slice(1).join('|'); img.src = alts[0]; return; } const p = img.parentNode; p.classList.add('empty'); p.removeAttribute('data-src'); p.innerHTML = ICON + 'Foto tidak ditemukan'; }
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const sw = document.querySelector('.switch'), box = document.getElementById('views');
  KEGIATAN.forEach((k,i)=>{
    sw.insertAdjacentHTML('beforeend',
      `<button class="sw" role="tab" id="t-${k.id}" aria-selected="${i===0}" aria-controls="v-${k.id}">${esc(k.tab)}</button>`);
    const items = k.foto.length
      ? k.foto.map(f=>`<figure class="item"><button class="ph" type="button" data-src="${esc(f.src)}" aria-label="Perbesar foto: ${esc(f.cap||k.judul)}"><img src="${esc(f.src)}" alt="${esc(f.cap||k.judul)}" loading="lazy" data-alts="${esc((f.alts||[]).join('|'))}" onerror="imgFail(this)"></button>${f.cap?`<figcaption>${esc(f.cap)}</figcaption>`:''}</figure>`).join('')
      : Array.from({length:SLOT},()=>`<figure class="item"><div class="ph empty">${ICON}Foto ${esc(k.judul)} akan ditambahkan</div></figure>`).join('');
    box.insertAdjacentHTML('beforeend',
      `<section class="view${i===0?' show':''}" id="v-${k.id}" role="tabpanel" aria-labelledby="t-${k.id}"${i===0?'':' hidden'}>
        <h2>${esc(k.judul)}</h2><p class="lead">${esc(k.ket)}</p><div class="gal">${items}</div></section>`);
  });

  /* pilih tab */
  const sws = [...document.querySelectorAll('.sw')], views = [...document.querySelectorAll('.view')];
  let cur = 0;
  function pick(n){
    cur = (n + sws.length) % sws.length;
    sws.forEach((b,i)=> b.setAttribute('aria-selected', i===cur));
    views.forEach((v,i)=>{ v.hidden = i!==cur; v.classList.toggle('show', i===cur); });
  }
  sws.forEach((b,i)=> b.addEventListener('click', ()=>pick(i)));

  /* perbesar foto */
  const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
  box.addEventListener('click', e=>{
    const b = e.target.closest('.ph[data-src]'); if(!b || b.classList.contains('empty')) return;
    const im = b.querySelector('img'); lbimg.src = im.currentSrc || im.src; lb.classList.add('open');
  });
  const closeLb = ()=> lb.classList.remove('open');
  lb.addEventListener('click', closeLb);

  /* transisi halaman */
  const bands = document.getElementById('bands');
  bands.lastElementChild.addEventListener('animationend', ()=> bands.classList.remove('enter'));
  function go(id){
    const a = document.getElementById(id);
    bands.classList.remove('enter');
    bands.getBoundingClientRect();
    bands.classList.add('go');
    setTimeout(()=>{ location.href = a.getAttribute('href'); }, 850);
  }
  ['back','next'].forEach(id=>{
    document.getElementById(id).addEventListener('click', e=>{ e.preventDefault(); go(id); });
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') closeLb();
    if(lb.classList.contains('open')) return;
    if(e.key==='ArrowRight') go('next');
    if(e.key==='ArrowLeft') go('back');
    if(e.key==='ArrowDown'){ e.preventDefault(); pick(cur+1); }
    if(e.key==='ArrowUp'){ e.preventDefault(); pick(cur-1); }
  });
</script>
</body>
</html>

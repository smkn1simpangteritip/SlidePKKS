<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penilaian Kinerja Kepala Sekolah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E3B43;        /* hijau teal tua */
    --bg2:#0A2C33;
    --gold:#F0B429;
    --paper:#F4F7F6;
    --muted:#A9C4C6;
    --display:'Bricolage Grotesque','Trebuchet MS',Arial,sans-serif;
    --body:'Figtree','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:var(--body);color:var(--paper);
    background:
      linear-gradient(rgba(10,44,51,.55),rgba(10,44,51,.55)),
      url('bg.png') center/cover no-repeat fixed,
      radial-gradient(1200px 700px at 85% 20%,#14525c 0%,var(--bg) 45%,var(--bg2) 100%);
    overflow:hidden;
  }
  .slide{
    height:100%;display:grid;grid-template-columns:1.25fr .75fr;align-items:center;
    gap:clamp(24px,5vw,80px);padding:clamp(24px,6vw,96px);max-width:1440px;margin:auto;
  }
  .text{max-width:720px}
  .event{font-size:clamp(14px,1.3vw,18px);color:var(--gold);font-weight:600;margin-bottom:18px}
  h1{
    font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em;
    font-size:clamp(38px,6.2vw,92px);margin-bottom:28px;
  }
  .reg{
    display:inline-block;border:2px solid var(--gold);color:var(--paper);
    padding:8px 16px;border-radius:999px;font-weight:600;font-size:clamp(13px,1.2vw,17px);margin-bottom:36px;
  }
  .author{border-left:4px solid var(--gold);padding-left:18px;line-height:1.55;font-size:clamp(14px,1.25vw,18px);color:var(--muted)}
  .author strong{display:block;color:var(--paper);font-family:var(--display);font-size:clamp(18px,1.9vw,26px);margin-bottom:2px}
  .author .lbl{color:var(--gold);font-weight:600}

  /* logo sekolah */
  .logo{
    position:fixed;top:clamp(16px,2.5vw,36px);left:clamp(16px,3vw,48px);z-index:5;
    height:clamp(52px,7vw,96px);width:auto;display:block;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));
  }

  /* foto */
  .photo{justify-self:center;position:relative;width:min(100%,380px);aspect-ratio:3/4}
  .photo::before{
    content:"";position:absolute;inset:0;transform:translate(16px,16px);
    border:3px solid var(--gold);border-radius:999px 999px 24px 24px;
  }
  .frame{
    position:relative;width:100%;height:100%;overflow:hidden;background:#1b5560;
    border-radius:999px 999px 24px 24px;
  }
  .frame img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .frame .ph{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:14px}
  .frame.empty .ph{display:grid}
  .frame.empty img{display:none}

  /* tombol Next unik: cincin teks berputar + panah */
  .next{
    position:fixed;right:clamp(16px,3vw,48px);bottom:clamp(16px,3vw,48px);
    width:132px;height:132px;border:0;background:none;cursor:pointer;color:var(--paper);
    text-decoration:none;display:grid;place-items:center;
  }
  .next svg.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite}
  .next text{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.16em;fill:var(--paper)}
  .next .core{
    width:62px;height:62px;border-radius:50%;background:var(--gold);color:var(--bg2);
    display:grid;place-items:center;overflow:hidden;position:relative;
    transition:transform .25s ease,width .25s ease,height .25s ease;
  }
  .next .core svg{width:28px;height:28px;transition:transform .3s ease}
  .next:hover .core,.next:focus-visible .core{width:76px;height:76px}
  .next:hover .core svg,.next:focus-visible .core svg{transform:translateX(5px)}
  .next:hover svg.ring{animation-duration:4s}
  .next:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:50%}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* transisi pindah halaman */
  .wipe{position:fixed;inset:0;background:var(--gold);transform:translateX(100%);pointer-events:none;z-index:10}
  .wipe.go{transform:translateX(0);transition:transform .55s cubic-bezier(.7,0,.2,1)}

  @media (max-width:820px){
    body{overflow:auto}
    .slide{grid-template-columns:1fr;height:auto;min-height:100%;padding-top:110px;padding-bottom:180px}
    .photo{order:-1;width:min(70%,280px)}
  }
  @media (prefers-reduced-motion:reduce){
    .next svg.ring{animation:none}
    .wipe.go{transition:none}
  }

  /* masuk halaman: muncul perlahan */
  body{animation:pageFade .6s ease both}
  @keyframes pageFade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){body{animation:none}}
</style>
</head>
<body>

<img class="logo" src="logosekolah.png" alt="Logo sekolah" onerror="this.style.display='none'">

<main class="slide">
  <section class="text">
    <p class="event">Kegiatan</p>
    <h1>Penilaian Kinerja Kepala Sekolah</h1>
    <p class="reg">Permendikbud No.40/2021 &amp; No.2024</p>
    <div class="author">
      <span class="lbl">Disusun oleh</span>
      <strong>Hasdiah, S.Pd., M.M.</strong>
      NIP. 197709262008042001<br>
      Pangkat/Golongan : Penata Tk.I/IIID
    </div>
  </section>

  <figure class="photo">
    <div class="frame" id="frame">
      <img src="photokepsek.png" alt="Foto Kepala Sekolah" onerror="document.getElementById('frame').classList.add('empty')">
      <div class="ph">Letakkan file <b>photokepsek.png</b> di folder yang sama dengan index.html</div>
    </div>
  </figure>
</main>

<a class="next" id="next" href="identitasdiri.html" aria-label="Lanjut ke halaman berikutnya">
  <svg class="ring" viewBox="0 0 132 132" aria-hidden="true">
    <defs><path id="c" d="M66,66 m-52,0 a52,52 0 1,1 104,0 a52,52 0 1,1 -104,0"/></defs>
    <text><textPath href="#c">NEXT • SELANJUTNYA • NEXT • SELANJUTNYA •</textPath></text>
  </svg>
  <span class="core">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </span>
</a>

<div class="wipe" id="wipe"></div>

<script>
  const next = document.getElementById('next');
  const wipe = document.getElementById('wipe');
  function goNext(e){
    if(e) e.preventDefault();
    wipe.classList.add('go');
    setTimeout(()=>{ location.href = next.getAttribute('href'); }, 560);
  }
  next.addEventListener('click', goNext);
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight' || e.key==='PageDown') goNext();
  });
</script>
</body>
</html>
